name: Build Phira Tournament APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: ${{github.workspace}}/android-sdk
  ANDROID_NDK_HOME: ${{github.workspace}}/android-ndk-r27c
  ANDROID_NDK_ROOT: ${{github.workspace}}/android-ndk-r27c

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config zip unzip wget

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0"

      - name: Install Android NDK
        run: |
          wget -q https://googledownloads.cn/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip -d ${{github.workspace}}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Rust Library (.so)
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          cd phira
          cargo ndk -t arm64-v8a --platform 35 build --release

      - name: Patch Official APK
        run: |
          # 1. 设置 build-tools 到 PATH
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH

          # 2. 下载官方最新的 Android APK
          echo "正在下载官方 APK..."
          wget -q https://github.com/TeamFlos/phira/releases/download/v0.8.2/Phira-android-arm64-v8a-v0.8.2.apk -O official.apk

          # 3. 解包官方 APK
          echo "正在解包官方 APK..."
          mkdir unpacked
          cd unpacked
          unzip -q ../official.apk

          # 4. 替换我们自己编译的 .so
          echo "=== 正在搜寻我们自己编译的 libphira.so ==="
          SO_PATH=$(find ../target -name "libphira.so" | head -n 1)
          echo "✅ 找到 .so: $SO_PATH"
          cp "$SO_PATH" lib/arm64-v8a/libphira.so

          # 5. 删掉旧签名
          rm -rf META-INF

          # 6. 重新打包
          echo "正在重新打包..."
          zip -q -r ../phira-patched-unsigned.apk *
          cd ..

          # 7. 对齐 (这一步必须做，否则手机可能装不上)
          echo "正在对齐..."
          zipalign -f -p 4 phira-patched-unsigned.apk phira-tournament-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phira-Tournament-Unsigned
          path: phira-tournament-unsigned.apk
