name: Build Android Phira APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: ${{github.workspace}}/android-sdk
  ANDROID_NDK_HOME: ${{github.workspace}}/android-ndk-r27c
  ANDROID_NDK_ROOT: ${{github.workspace}}/android-ndk-r27c

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-35"

      - name: Install Android NDK
        run: |
          wget -q https://googledownloads.cn/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip -d ${{github.workspace}}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Rust Library (.so)
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk
          cd phira
          cargo ndk -t arm64-v8a --platform 35 build --release

      - name: Prepare Android Project
        run: |
          mkdir -p app/src/main/java/com/teamflos/phira/tournament
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          
          echo "=== 正在搜寻 libphira.so ==="
          # 自动在 target 目录里寻找 .so，防止路径不一致
          SO_PATH=$(find target -name "libphira.so" | head -n 1)
          if [ -z "$SO_PATH" ]; then
            echo "❌ 依然没找到 .so"
            exit 1
          fi
          echo "✅ 找到 .so: $SO_PATH"
          cp "$SO_PATH" app/src/main/jniLibs/arm64-v8a/
          
          cp $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so app/src/main/jniLibs/arm64-v8a/
          
          # 拷贝 assets (兼容 assets 在根目录还是在 phira 目录)
          if [ -d "assets" ]; then
            cp -r assets/* app/src/main/assets/
          elif [ -d "phira/assets" ]; then
            cp -r phira/assets/* app/src/main/assets/
          else
            echo "⚠️ 找不到 assets 文件夹，请检查你的仓库结构！"
          fi
          
          cat << 'EOF' > app/src/main/java/com/teamflos/phira/tournament/MainActivity.kt
          package com.teamflos.phira.tournament
          import android.app.NativeActivity
          import android.os.Bundle
          class MainActivity : NativeActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
              }
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Phira Tournament">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build APK with Gradle
        run: |
          # ⚠️ 加这一行，强行指定 SDK 路径，解决冲突
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.teamflos.phira.tournament'
              compileSdk 35
              defaultConfig {
                  applicationId "com.teamflos.phira.tournament"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
              }
              sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }
              buildTypes { release { minifyEnabled false } }
          }
          EOF
          
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phira-Tournament-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
